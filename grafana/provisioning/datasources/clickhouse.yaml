apiVersion: 1

datasources:
  - name: Market Integrity ClickHouse
    uid: market-integrity-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: ${CLICKHOUSE_GRAFANA_USER}
      defaultDatabase: market_integrity
      configMode: classic
      dialTimeout: 10
      queryTimeout: 15
      maxOpenConns: 10
      maxIdleConns: 5
      enableMapKeysDiscovery: false
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
