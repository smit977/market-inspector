name: market-move-integrity

services:
  app:
    image: market-move-integrity-app
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    init: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROCESSING_MODE: ${PROCESSING_MODE:-live}
      PROCESSING_RUN_ID: ${PROCESSING_RUN_ID:-current}
      DERIVATIVES_SPOT_MAX_AGE_SECONDS: ${DERIVATIVES_SPOT_MAX_AGE_SECONDS:-5}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      BINANCE_WS_BASE_URL: ${BINANCE_WS_BASE_URL:-wss://data-stream.binance.vision}
      BINANCE_TRADE_SYMBOL: ${BINANCE_TRADE_SYMBOL:-BTCUSDT}
      COINBASE_WS_URL: ${COINBASE_WS_URL:-wss://ws-feed.exchange.coinbase.com}
      COINBASE_TRADE_SYMBOL: ${COINBASE_TRADE_SYMBOL:-BTC-USD}
      KRAKEN_WS_URL: ${KRAKEN_WS_URL:-wss://ws.kraken.com/v2}
      KRAKEN_TRADE_SYMBOL: ${KRAKEN_TRADE_SYMBOL:-BTC/USD}
      OKX_WS_URL: ${OKX_WS_URL:-wss://ws.okx.com:8443/ws/v5/public}
      OKX_TRADE_SYMBOL: ${OKX_TRADE_SYMBOL:-BTC-USDT}
      BYBIT_WS_URL: ${BYBIT_WS_URL:-wss://stream.bybit.com/v5/public/spot}
      BYBIT_TRADE_SYMBOL: ${BYBIT_TRADE_SYMBOL:-BTCUSDT}
      CROSS_VENUE_STALE_AFTER_MS: ${CROSS_VENUE_STALE_AFTER_MS:-5000}
      CROSS_VENUE_CALCULATION_INTERVAL_MS: ${CROSS_VENUE_CALCULATION_INTERVAL_MS:-1000}
      CROSS_VENUE_MIN_ACTIVE_VENUES: ${CROSS_VENUE_MIN_ACTIVE_VENUES:-3}
      DERIVATIVES_OI_POLL_INTERVAL_MS: ${DERIVATIVES_OI_POLL_INTERVAL_MS:-5000}
      DERIVATIVES_NO_TRADE_TIMEOUT_MS: ${DERIVATIVES_NO_TRADE_TIMEOUT_MS:-15000}
      INTEGRITY_MAX_EVIDENCE_AGE_SECONDS: ${INTEGRITY_MAX_EVIDENCE_AGE_SECONDS:-5}
      BINANCE_ORDERBOOK_SYMBOL: ${BINANCE_ORDERBOOK_SYMBOL:-BTCUSDT}
      BINANCE_ORDERBOOK_INTERVAL_MS: ${BINANCE_ORDERBOOK_INTERVAL_MS:-100}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://data-api.binance.vision}
      BINANCE_ORDERBOOK_SNAPSHOT_LIMIT: ${BINANCE_ORDERBOOK_SNAPSHOT_LIMIT:-1000}
      ORDERBOOK_PUBLISH_DEPTH: ${ORDERBOOK_PUBLISH_DEPTH:-20}
      ORDERBOOK_PUBLISH_INTERVAL_MS: ${ORDERBOOK_PUBLISH_INTERVAL_MS:-250}
      FEATURE_CALCULATION_INTERVAL_MS: ${FEATURE_CALCULATION_INTERVAL_MS:-1000}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_integrity}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_ENABLED: ${CLICKHOUSE_ENABLED:-true}
      CLICKHOUSE_BATCH_SIZE: ${CLICKHOUSE_BATCH_SIZE:-500}
      CLICKHOUSE_FLUSH_INTERVAL_MS: ${CLICKHOUSE_FLUSH_INTERVAL_MS:-1000}
      CLICKHOUSE_MAX_RETRIES: ${CLICKHOUSE_MAX_RETRIES:-3}
      CLICKHOUSE_RETRY_BACKOFF_MS: ${CLICKHOUSE_RETRY_BACKOFF_MS:-500}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./grafana:/app/grafana:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    depends_on:
      kafka:
        condition: service_healthy

  binance-trades:
    extends: {service: app}
    command: ["python", "scripts/run_binance_trades.py"]
    restart: unless-stopped

  coinbase-trades:
    extends: {service: app}
    command: ["python", "scripts/run_coinbase_trades.py"]
    restart: unless-stopped

  kraken-trades:
    extends: {service: app}
    command: ["python", "scripts/run_kraken_trades.py"]
    restart: unless-stopped

  okx-trades:
    extends: {service: app}
    command: ["python", "scripts/run_okx_trades.py"]
    restart: unless-stopped

  bybit-trades:
    extends: {service: app}
    command: ["python", "scripts/run_bybit_trades.py"]
    restart: unless-stopped

  binance-orderbook:
    extends: {service: app}
    command: ["python", "scripts/run_binance_orderbook.py"]
    restart: unless-stopped

  derivatives-ingestion:
    extends: {service: app}
    command: ["python", "scripts/run_derivatives_ingestion.py"]
    restart: unless-stopped

  trade-normalizer:
    extends: {service: app}
    command: ["python", "scripts/run_trade_normalizer.py"]
    restart: unless-stopped

  orderbook-reconstructor:
    extends: {service: app}
    command: ["python", "scripts/run_binance_orderbook_reconstructor.py"]
    restart: unless-stopped

  feature-engine:
    extends: {service: app}
    command: ["python", "scripts/run_feature_engine.py"]
    restart: unless-stopped

  cross-venue-features:
    extends: {service: app}
    command: ["python", "scripts/run_cross_venue_features.py"]
    restart: unless-stopped

  derivatives-features:
    extends: {service: app}
    command: ["python", "scripts/run_derivatives_features.py"]
    restart: unless-stopped

  move-detector:
    extends: {service: app}
    command: ["python", "scripts/run_move_detector.py"]
    restart: unless-stopped

  integrity-engine:
    extends: {service: app}
    command: ["python", "scripts/run_integrity_engine.py"]
    restart: unless-stopped

  clickhouse-writer:
    restart: unless-stopped
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    init: true
    command: ["python", "scripts/run_clickhouse_writer.py"]
    environment:
      PROCESSING_MODE: ${PROCESSING_MODE:-live}
      PROCESSING_RUN_ID: ${CLICKHOUSE_PROCESSING_RUN_ID:-v2}
      CLICKHOUSE_CONSUMER_GROUP_ID: ${CLICKHOUSE_CONSUMER_GROUP_ID:-clickhouse-writer-v1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_integrity}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_ENABLED: ${CLICKHOUSE_ENABLED:-true}
      CLICKHOUSE_BATCH_SIZE: ${CLICKHOUSE_BATCH_SIZE:-500}
      CLICKHOUSE_FLUSH_INTERVAL_MS: ${CLICKHOUSE_FLUSH_INTERVAL_MS:-1000}
      CLICKHOUSE_MAX_RETRIES: ${CLICKHOUSE_MAX_RETRIES:-3}
      CLICKHOUSE_RETRY_BACKOFF_MS: ${CLICKHOUSE_RETRY_BACKOFF_MS:-500}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Stable development identity, not a credential. Keep it with the data volume.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Mk1JRW5naW5lRGV2Q2x1cw}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: market-move-integrity
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-market_integrity}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  clickhouse-grafana-user:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["python", "scripts/init_grafana_clickhouse_user.py"]
    restart: "no"
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_integrity}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_GRAFANA_USER: ${CLICKHOUSE_GRAFANA_USER:-grafana_reader}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?Set CLICKHOUSE_GRAFANA_PASSWORD in .env}
    depends_on:
      clickhouse:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_DEFAULT_THEME: dark
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.21.3
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 2s
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-grafana-user:
        condition: service_completed_successfully

  clickhouse-mcp-user:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["python", "scripts/init_mcp_clickhouse_user.py"]
    restart: "no"
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_integrity}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_MCP_USER: ${CLICKHOUSE_MCP_USER:-mcp_reader}
      CLICKHOUSE_MCP_PASSWORD: ${CLICKHOUSE_MCP_PASSWORD:?Set CLICKHOUSE_MCP_PASSWORD in .env}
    depends_on:
      clickhouse:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["python", "scripts/run_mcp_server.py"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:${MCP_PORT:-8001}"
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8001}
      MCP_QUERY_TIMEOUT_SECONDS: ${MCP_QUERY_TIMEOUT_SECONDS:-5}
      MCP_MAX_RESULT_ROWS: ${MCP_MAX_RESULT_ROWS:-500}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_integrity}
      CLICKHOUSE_USER: ${CLICKHOUSE_MCP_USER:-mcp_reader}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MCP_PASSWORD:?Set CLICKHOUSE_MCP_PASSWORD in .env}
      CLICKHOUSE_ENABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; os.environ.get('MCP_TRANSPORT', 'streamable-http') == 'stdio' or socket.create_connection(('127.0.0.1', int(os.environ.get('MCP_PORT', '8001'))), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-mcp-user:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro

  replay:
    extends: {service: app}
    image: market-move-integrity-replay
    profiles: ["replay"]
    environment:
      PROCESSING_MODE: replay
    cpus: "1.0"
    mem_limit: 2g
    volumes:
      - ./data/replay:/app/data/replay
      - ./.git:/app/.git:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./Dockerfile:/app/Dockerfile:ro
    command: ["python", "scripts/run_replay.py", "--help"]

  fabric-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["fabric"]
    working_dir: /app
    command: ["python", "scripts/run_fabric_exporter.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_KAFKA_BOOTSTRAP_SERVERS: ${FABRIC_KAFKA_BOOTSTRAP_SERVERS:-}
      FABRIC_KAFKA_USERNAME: ${FABRIC_KAFKA_USERNAME:-}
      FABRIC_KAFKA_PASSWORD: ${FABRIC_KAFKA_PASSWORD:-}
      FABRIC_SECURITY_PROTOCOL: ${FABRIC_SECURITY_PROTOCOL:-SASL_SSL}
      FABRIC_SASL_MECHANISM: ${FABRIC_SASL_MECHANISM:-PLAIN}
      FABRIC_TOPIC_METRICS: ${FABRIC_TOPIC_METRICS:-}
      FABRIC_TOPIC_CROSS_VENUE: ${FABRIC_TOPIC_CROSS_VENUE:-}
      FABRIC_TOPIC_DERIVATIVES: ${FABRIC_TOPIC_DERIVATIVES:-}
      FABRIC_TOPIC_ANOMALIES: ${FABRIC_TOPIC_ANOMALIES:-}
      FABRIC_TOPIC_INTEGRITY: ${FABRIC_TOPIC_INTEGRITY:-}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:
  grafana_data:
